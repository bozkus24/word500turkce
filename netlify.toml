# Netlify yapılandırması — word500tr
# Statik site; derleme adımı yok, kök dizin olduğu gibi yayımlanır.

[build]
  publish = "."
  command = ""

# Temel güvenlik başlıkları. (Firebase'i engellememek için katı bir
# Content-Security-Policy bilerek eklenmedi.)
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# HTML ve yapılandırma her zaman taze gelsin (anahtar güncellemeleri anında
# yansısın); statik varlıklar tarayıcıda bir süre önbelleğe alınabilir.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/firebase-config.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
